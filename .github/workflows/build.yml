name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Bun on ubuntu-latest

    runs-on: ubuntu-latest
    timeout-minutes: 15

    # No bun package cache: restoring it took longer than a cold install.
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      - name: Test
        run: bun run test

      - name: Pack the npm package
        run: bun pm pack

      # #5114: ensure the packed tarball contains every file needed at runtime.
      - name: Smoke-test the packaged binary
        run: |
          mkdir -p /tmp/thelounge-pack
          tar xzf thelounge-*.tgz -C /tmp/thelounge-pack
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/thelounge-pack/package/node_modules
          version="$(bun /tmp/thelounge-pack/package/index.js --version)"
          echo "thelounge --version => $version"
          echo "$version" | grep -Eq 'v?[0-9]+\.[0-9]+\.[0-9]+'
