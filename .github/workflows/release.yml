name: Release

permissions:
  contents: read
  id-token: write

on:
  push:
    tags: v*
  workflow_dispatch:

jobs:
  release:
    name: Release workflow

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # TODO: we should use node-version-file but the version of npm with node 22 has issues updating to the latest version
          # https://github.com/nodejs/node/issues/62425
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      - name: Test
        run: bun run test

      - name: Publish latest
        if: "!contains(github.ref, '-')"
        run: npm publish --tag latest --provenance

      - name: Publish next
        if: contains(github.ref, '-')
        run: npm publish --tag next --provenance

      - name: Remove next tag
        if: "!contains(github.ref, '-')"
        run: npm dist-tag rm thelounge next || true
